<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arena FPS</title>
<style>
:root{--bg:#0b0e14;--fg:#e8ecf4;--acc:#ff4d4d;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0b0e14;--fg:#e8ecf4}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;font-weight:700;font-size:16px;text-shadow:0 1px 3px #000;pointer-events:none}
#hp{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 40px);height:8px;background:#0006;border-radius:4px;overflow:hidden;pointer-events:none}
#hpb{height:100%;width:100%;background:#4ade80;transition:width .15s}
:root{--cs:22px;--cc:#fff}
#cross{position:fixed;left:50%;top:50%;width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:var(--cc);opacity:.9}
#cross:before{left:calc(50% - 1px);top:0;width:2px;height:100%}
#cross:after{top:calc(50% - 1px);left:0;height:2px;width:100%}
#ov{z-index:5}
#gear{position:fixed;left:50%;margin-left:-18px;top:calc(env(safe-area-inset-top,0px) + 4px);width:36px;height:36px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:18px;z-index:2}
#set{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:46vh;overflow:auto;background:#121722ee;border:1px solid #fff3;border-radius:14px;padding:12px 14px;z-index:10;display:none;touch-action:pan-y}
#set h2{margin:0 0 8px;font-size:17px}
#set label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;font-size:14px}
#set input[type=range]{flex:1;max-width:55%}
#cols{display:flex;gap:10px;margin:8px 0;align-items:center;font-size:14px}
#cols button{width:30px;height:30px;border-radius:50%;border:2px solid #fff6;padding:0}
.row{display:flex;gap:10px;margin-top:10px}
.row button,#ahud{flex:1;padding:10px;border:0;border-radius:10px;background:#2a3142;color:#fff;font-weight:700;font-size:15px}
#ahud{flex:none;padding:10px 24px}
body.edit #fire,body.edit #hud,body.edit #hp,body.edit #cross,body.edit .b{outline:2px dashed #facc15;outline-offset:6px}
#set{max-height:78vh;max-width:480px}
#hud,#hp{z-index:2}
#fire{z-index:3}
.b{position:fixed;width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:#334155cc;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:3}
.b.on{background:#4ade80cc;color:#000}
#jump{right:124px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#slide{right:124px;bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
#aim{right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 134px)}
#wpn{right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);width:58px;height:58px;font-size:11px}
#scope{position:fixed;inset:0;display:none;pointer-events:none;z-index:1;background:radial-gradient(circle at center,transparent 0,transparent 36vmin,#000 36.5vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000}
#scope:before{left:50%;top:50%;width:2px;height:72vmin;margin:-36vmin 0 0 -1px}
#scope:after{left:50%;top:50%;height:2px;width:72vmin;margin:-1px 0 0 -36vmin}
#rot{position:fixed;inset:0;background:#000f;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;padding:30px;z-index:20}
@media (orientation:portrait){#rot{display:flex}}
#eb{position:fixed;left:50%;top:28%;transform:translateX(-50%);background:#121722ee;border:1px solid #fff3;border-radius:12px;padding:10px 14px;text-align:center;font-size:14px;display:none;z-index:11;width:230px}
#eb button{margin-top:8px;padding:8px 22px;border:0;border-radius:8px;background:#4ade80;color:#000;font-weight:700;font-size:15px}
#cross.hit:before,#cross.hit:after{background:var(--acc)}
#dmg{position:fixed;inset:0;background:radial-gradient(transparent 40%,#f00);opacity:0;pointer-events:none;transition:opacity .25s}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid #fff6;border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff8}
#fire{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:92px;height:92px;border-radius:50%;background:#ff4d4dcc;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
#fire.on{background:#ff9a9a}
#ov{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#ov h1{margin:0;font-size:32px}
#ov p{margin:0;opacity:.85;max-width:300px;line-height:1.4}
#go{font-size:18px;font-weight:700;padding:14px 36px;border:0;border-radius:12px;background:var(--acc);color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scope"></div>
<div id="rot">Põe o telemóvel deitado para jogar</div>
<div id="hud"><span id="sc">Pontos: 0</span><span id="am">30/30</span><span id="wv">Vaga 1</span></div>
<div id="hp"><div id="hpb"></div></div>
<div id="cross"></div>
<div id="dmg"></div>
<div id="joy"><div id="knob"></div></div>
<div id="fire">FOGO</div>
<div id="jump" class="b">PULAR</div>
<div id="slide" class="b">SLIDE</div>
<div id="aim" class="b">MIRA</div>
<div id="wpn" class="b">RIFLE</div>
<div id="eb">Arrasta cada elemento (botão FOGO, texto, vida, mira) para onde quiseres.<br><button id="eb_ok">Concluir</button></div>
<button id="gear">⚙</button>
<div id="set">
  <h2>Ajustar HUD</h2>
  <div id="cols">Mira:
    <button data-c="#ffffff" style="background:#fff"></button>
    <button data-c="#4ade80" style="background:#4ade80"></button>
    <button data-c="#22d3ee" style="background:#22d3ee"></button>
    <button data-c="#facc15" style="background:#facc15"></button>
    <button data-c="#f472b6" style="background:#f472b6"></button>
  </div>
  <label>Tamanho da mira<input type="range" id="s_cs" min=10 max=70></label>
  <label>Tamanho do texto<input type="range" id="s_hud" min=12 max=28></label>
  <label>Botão FOGO: tamanho<input type="range" id="s_fire" min=60 max=150></label>
  <label>Botão FOGO: opacidade<input type="range" id="s_fop" min=20 max=100></label>
  <label>Sensibilidade da mira<input type="range" id="s_sens" min=40 max=250></label>
  <label>Mostrar barra de vida<input type="checkbox" id="s_hp"></label>
  <label>Mostrar pontos e vaga<input type="checkbox" id="s_sc"></label>
  <div class="row"><button id="s_mv">Mover</button><button id="s_rs">Repor</button><button id="s_ok">Fechar</button></div>
</div>
<div id="ov">
  <h1 id="ttl">Arena FPS</h1>
  <p id="msg">Esquerda: arrasta para andar. Direita: arrasta para mirar. Botão FOGO para disparar. Sobrevive às vagas!</p>
  <button id="go">Jogar</button>
  <button id="ahud">Ajustar HUD</button>
</div>
